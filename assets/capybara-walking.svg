<svg viewBox="0 0 800 170" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mover {
      animation: walkAcross 8s linear infinite;
    }
    @keyframes walkAcross {
      0%   { transform: translateX(-160px); }
      100% { transform: translateX(940px); }
    }
    .legFL { animation: stepA 0.45s ease-in-out infinite alternate; }
    .legBR { animation: stepA 0.45s ease-in-out infinite alternate; }
    .legFR { animation: stepB 0.45s ease-in-out infinite alternate; }
    .legBL { animation: stepB 0.45s ease-in-out infinite alternate; }
    @keyframes stepA { 0% { transform: rotate(-16deg); } 100% { transform: rotate(16deg); } }
    @keyframes stepB { 0% { transform: rotate(16deg); } 100% { transform: rotate(-16deg); } }
    .head { animation: nod 0.9s ease-in-out infinite alternate; transform-origin: 155px 78px; }
    @keyframes nod { 0% { transform: rotate(-3deg); } 100% { transform: rotate(2deg); } }
    .shadow { animation: shadowPulse 0.45s ease-in-out infinite alternate; transform-origin: 95px 150px; }
    @keyframes shadowPulse { 0% { transform: scaleX(0.88); } 100% { transform: scaleX(1.05); } }
    .legFL, .legFR, .legBL, .legBR { transform-box: fill-box; transform-origin: top center; }
  </style>

  <g class="mover">
    <ellipse class="shadow" cx="95" cy="150" rx="55" ry="8" fill="#000" opacity="0.15"/>

    <rect class="legBL" x="50" y="106" width="11" height="34" rx="5" fill="#4a2e1e"/>
    <rect class="legBR" x="72" y="108" width="11" height="34" rx="5" fill="#3d2517"/>

    <ellipse cx="95" cy="98" rx="65" ry="42" fill="#9c6b3f"/>
    <ellipse cx="95" cy="118" rx="55" ry="22" fill="#8a5c34" opacity="0.55"/>

    <rect class="legFL" x="128" y="103" width="11" height="34" rx="5" fill="#4a2e1e"/>
    <rect class="legFR" x="150" y="103" width="11" height="34" rx="5" fill="#5c3b22"/>

    <g class="head">
      <ellipse cx="152" cy="76" rx="34" ry="30" fill="#a97a4a"/>
      <ellipse cx="180" cy="86" rx="17" ry="13" fill="#c9975c"/>
      <ellipse cx="174" cy="88" rx="2.4" ry="2" fill="#3b2416"/>
      <ellipse cx="186" cy="88" rx="2.4" ry="2" fill="#3b2416"/>
      <circle cx="160" cy="70" r="3.2" fill="#2b1b12"/>
      <circle cx="161" cy="69" r="1" fill="#fff"/>
      <ellipse cx="130" cy="52" rx="8" ry="7" fill="#7a5330"/>
      <ellipse cx="168" cy="48" rx="7.5" ry="6.5" fill="#7a5330"/>
      <ellipse cx="130" cy="52" rx="4" ry="3.5" fill="#c9975c"/>
      <ellipse cx="168" cy="48" rx="3.8" ry="3.2" fill="#c9975c"/>
    </g>
  </g>
</svg>
